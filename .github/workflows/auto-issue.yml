name: Auto-create Issue on CI Failure
on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

jobs:
  create-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create issue and assign to Copilot
        env:
          # Swapping to your PAT overcomes the GitHub token restriction
          GH_TOKEN: ${{ secrets.COPILOT_DEMO_TOKEN }} 
        run: |
          gh issue create \
            --title "Fix CI failure: ${{ github.event.workflow_run.name }}" \
            --body "## Workflow failed 🔴

          **Workflow:** ${{ github.event.workflow_run.name }}
          **Branch:** ${{ github.event.workflow_run.head_branch }}
          **Run URL:** ${{ github.event.workflow_run.html_url }}

          Please analyze the repository code, find out why the tests failed, and open a PR with the fix." \
            --assignee "@copilot" \
            --repo ${{ github.repository }}