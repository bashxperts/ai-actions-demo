name: AI Release Notes
on:
  push:
    branches: [main]
    
permissions:
  contents: read
  models: read
  
jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Collect recent commits
        id: commits
        run: |
          echo "LOG<<EOF" >> $GITHUB_ENV
          git log -10 --pretty=format:"- %s (%an)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: List Models
        run: |
          curl -s https://models.github.ai/catalog/models \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq .

      - name: Generate Changelog
        id: ai
        uses: actions/github-script@v7
        env:
          COMMIT_LOG: ${{ env.LOG }}
        with:
          script: |
            const response = await fetch(
              "https://models.github.ai/inference/chat/completions",
              {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${process.env.GITHUB_TOKEN}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  model: "openai/gpt-4.1-mini",
                  messages: [
                    {
                      role: "system",
                      content: "You are a technical writer. Write concise markdown release notes."
                    },
                    {
                      role: "user",
                      content: `Commits:\n${process.env.COMMIT_LOG}`
                    }
                  ]
                })
              }
            );
      
            const data = await response.json();
      
            core.setOutput(
              "content",
              data.choices[0].message.content
            );

