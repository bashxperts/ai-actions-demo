name: Auto-create Issue on CI Failure
on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

jobs:
  create-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create issue and assign to Copilot Workspace Agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_DEMO_TOKEN }}
        run: |
          # 1. Escape the multiline body safely for JSON
          BODY_TEXT="## Workflow failed 🔴\n\n**Workflow:** ${{ github.event.workflow_run.name }}\n**Branch:** ${{ github.event.workflow_run.head_branch }}\n\nPlease analyze the repo and fix the failing test."
          
          # 2. Use the dedicated REST/GraphQL endpoint that explicitly targets the agent assignment flow
          gh api repos/${{ github.repository }}/issues \
            -f title="Fix CI failure: ${{ github.event.workflow_run.name }}" \
            -f body="$BODY_TEXT" \
            -F assignees='["copilot-swe-agent"]'
