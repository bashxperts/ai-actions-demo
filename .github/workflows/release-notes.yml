name: AI Release Notes
on:
  push:
    branches: [main]
    
permissions:
  contents: read
  models: read
  
jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Collect recent commits
        id: commits
        run: |
          echo "LOG<<EOF" >> $GITHUB_ENV
          git log -10 --pretty=format:"- %s (%an)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: List Models
        run: |
          curl -s https://models.github.ai/catalog/models \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq .



