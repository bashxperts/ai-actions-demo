name: Auto-create Issue on CI Failure
on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

jobs:
  create-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create issue and assign to Copilot Workspace Agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_DEMO_TOKEN }}
        run: |
          # 1. Store variables so they map correctly inside the JSON heredoc
          TITLE_TEXT="Fix CI failure: ${{ github.event.workflow_run.name }}"
          BODY_TEXT="## Workflow failed 🔴\n\n**Workflow:** ${{ github.event.workflow_run.name }}\n**Branch:** ${{ github.event.workflow_run.head_branch }}\n\nPlease analyze the repo and fix the failing test."
          
          # 2. Feed the entire valid JSON structure into the API via stdin
          gh api repos/${{ github.repository }}/issues --input - <<EOF
          {
            "title": "$TITLE_TEXT",
            "body": "$BODY_TEXT",
            "assignees": ["copilot-swe-agent"]
          }
          EOF
