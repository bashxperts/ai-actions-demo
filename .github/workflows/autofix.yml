name: autofix.ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Run your linter/formatter with the flag that actually rewrites the files
      - name: Run Prettier
        run: npx prettier --write .

      # Trigger the app to commit the changes if Prettier caught anything
      - name: Trigger Autofix
        uses: autofix-ci/action@v1
