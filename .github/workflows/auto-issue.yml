name: Auto-create Issue on CI Failure
on:
  workflow_dispatch: 
  #workflow_run:
    #workflows: ["Run Tests"]
    #types: [completed]

jobs:
  create-issue:
    # 1. Must be a failure
    # 2. Must have been triggered by a pull_request event
    # 3. The PR creator must NOT be the copilot bot itself (The Loop Breaker!)
    # Disable the workflow immediately if the copilot is looping out
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.sender.login != 'copilot-swe-agent' &&
      github.event.sender.login != 'github-actions[bot]'
    
    runs-on: ubuntu-latest

    steps:
      - name: Create issue and assign to Copilot Workspace Agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_DEMO_TOKEN }}
        run: |
          gh issue create \
            --title "CI failure on PR: ${{ github.event.workflow_run.name }}" \
            --body "## PR Workflow failed 🔴

          **Workflow:** ${{ github.event.workflow_run.name }}
          **Branch:** ${{ github.event.workflow_run.head_branch }}
          **Triggered By:** @${{ github.event.sender.login }}
          **Run URL:** ${{ github.event.workflow_run.html_url }}

          Please investigate and fix the failing workflow on this branch." \
            --assignee "@copilot" \
            --repo ${{ github.repository }}
